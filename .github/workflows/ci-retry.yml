name: CI retry
on: push
permissions:
  actions: write
jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Rerun failed jobs on the pull request run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/cjber/shortest-path-forever/actions/runs/42464319541/rerun-failed-jobs
