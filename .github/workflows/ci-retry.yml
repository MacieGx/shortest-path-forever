name: CI retry
on: push
permissions:
  actions: write
  contents: read
jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Poll the release CDN then rerun the failed main jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          G=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          A=https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          L=https://github.com/LuaLS/lua-language-server/releases/download/3.19.1/lua-language-server-3.19.1-linux-x64.tar.gz
          S=https://github.com/JohnnyMorganz/StyLua/releases/download/v2.3.0/stylua-linux-x86_64.zip
          for i in $(seq 1 28); do
            a=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 20 "$G")
            b=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 20 "$A")
            c=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 20 "$L")
            d=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 20 "$S")
            echo "attempt $i: gitleaks=$a actionlint=$b luals=$c stylua=$d"
            if [ "$a" = "200" ] && [ "$b" = "200" ] && [ "$c" = "200" ] && [ "$d" = "200" ]; then
              gh api -X POST repos/cjber/shortest-path-forever/actions/runs/42470827171/rerun-failed-jobs && echo requested
              for j in $(seq 1 30); do
                sleep 45
                pend=$(gh api "repos/cjber/shortest-path-forever/actions/runs/42470827171/jobs?per_page=50" --jq '[.jobs[]|select(.status!="completed")]|length')
                fail=$(gh api "repos/cjber/shortest-path-forever/actions/runs/42470827171/jobs?per_page=50" --jq '[.jobs[]|select(.conclusion=="failure")]|length')
                echo "pending=$pend fail=$fail"
                [ "$pend" = "0" ] && [ "$fail" = "0" ] && exit 0
                [ "$pend" = "0" ] && exit 1
              done
              exit 0
            fi
            sleep 95
          done
